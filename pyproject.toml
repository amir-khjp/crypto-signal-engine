[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-signal-engine"
version = "0.1.0"
description = "Buy/sell signal engine for crypto markets: technical rules, ML probabilities, walk-forward backtests, dashboard and alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "requests>=2.31",
    "streamlit>=1.50",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cryptosignal = "cryptosignal.cli:main"

[tool.setuptools.packages.find]
include = ["cryptosignal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
